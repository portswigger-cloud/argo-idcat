[package]
name = "argo-idcat"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "GitHub App installation token endpoint for argo-cd, backed by idcat"

[dependencies]
anyhow = "1.0"
# The AWS SDK without its default HTTPS client, which brings in aws-lc-rs:
# argo-idcat gives it one with rustls and ring.
aws-config = { version = "1.13", default-features = false, features = ["rt-tokio"] }
aws-credential-types = "1"
aws-smithy-async = { version = "1.3", default-features = false, features = ["rt-tokio"] }
aws-sdk-sts = { version = "1.123", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1.5", default-features = false, features = ["rustls-ring"] }
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
humantime = "2.3"
# rustls with ring rather than reqwest's default aws-lc-rs, which needs cmake to
# build, and with no OpenSSL needed in the image.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
aws-smithy-runtime-api = { version = "1.19", default-features = false, features = ["client"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
